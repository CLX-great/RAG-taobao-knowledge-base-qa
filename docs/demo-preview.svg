<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="760" fill="#F8F6F4"/>
  <rect x="120" y="60" width="1160" height="640" rx="34" fill="#F1F1F1"/>

  <g>
    <rect x="188" y="144" width="540" height="84" rx="16" fill="#FFFFFF"/>
    <text x="220" y="196" fill="#1F2A37" font-size="26" font-family="Arial, Helvetica, sans-serif">您好，我是淘宝知识库问答助手</text>
  </g>

  <g>
    <rect x="748" y="118" width="400" height="130" rx="20" fill="#F2DFD1"/>
    <text x="778" y="177" fill="#1F2A37" font-size="30" font-family="Arial, Helvetica, sans-serif">怎么申请退货？</text>
  </g>

  <g>
    <rect x="188" y="255" width="960" height="278" rx="24" fill="#F7F7F7"/>
    <text x="220" y="320" fill="#1F2A37" font-size="28" font-family="Arial, Helvetica, sans-serif">根据知识库内容，退货流程如下：</text>
    <text x="220" y="370" fill="#374151" font-size="24" font-family="Arial, Helvetica, sans-serif">1. 进入“我的订单”，选择对应订单。</text>
    <text x="220" y="420" fill="#374151" font-size="24" font-family="Arial, Helvetica, sans-serif">2. 提交售后申请，并选择退货退款或换货。</text>
    <text x="220" y="470" fill="#374151" font-size="24" font-family="Arial, Helvetica, sans-serif">3. 按照页面提示填写退货原因，并上传凭证。</text>
    <text x="220" y="510" fill="#374151" font-size="24" font-family="Arial, Helvetica, sans-serif">参考来源：telecom_plans.md#0, telecom_plans.md#4</text>
  </g>

  <g>
    <rect x="70" y="610" width="1020" height="70" rx="18" fill="#FFFFFF" stroke="#FF8E3C" stroke-width="4"/>
    <text x="108" y="654" fill="#9CA3AF" font-size="26" font-family="Arial, Helvetica, sans-serif">请输入你的淘宝问题...</text>
    <rect x="1100" y="618" width="160" height="58" rx="18" fill="#FF8E3C"/>
    <text x="1148" y="656" fill="#FFFFFF" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700">发送</text>
  </g>
</svg>
