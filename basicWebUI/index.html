<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>淘宝知识库问答助手</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --panel: #ffffff;
        --primary: #ff6a00;
        --primary-dark: #e55b00;
        --text: #1f2430;
        --muted: #667085;
        --bot: #f3f4f6;
        --user: #ffe9dc;
        --border: #ebedf2;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #fffaf5 0%, var(--bg) 100%);
        color: var(--text);
      }

      .app {
        max-width: 980px;
        margin: 32px auto;
        padding: 20px;
      }

      .header {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 20px 24px;
        box-shadow: 0 10px 30px rgba(17, 24, 39, 0.05);
      }

      .header h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      .header p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .chat-box {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        margin-top: 18px;
        box-shadow: 0 12px 30px rgba(17, 24, 39, 0.04);
        overflow: hidden;
      }

      .messages {
        height: 520px;
        overflow-y: auto;
        padding: 20px;
        background: #fff;
      }

      .message {
        display: flex;
        margin-bottom: 16px;
      }

      .message.user {
        justify-content: flex-end;
      }

      .bubble {
        max-width: 78%;
        padding: 12px 14px;
        border-radius: 16px;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .message.user .bubble {
        background: var(--user);
        color: #3b2207;
        border-bottom-right-radius: 6px;
      }

      .message.bot .bubble {
        background: var(--bot);
        color: var(--text);
        border-bottom-left-radius: 6px;
      }

      .composer {
        display: flex;
        gap: 12px;
        padding: 16px 18px 18px;
        border-top: 1px solid var(--border);
        background: #fff;
      }

      textarea {
        flex: 1;
        min-height: 54px;
        max-height: 150px;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 15px;
        outline: none;
      }

      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.12);
      }

      button {
        border: none;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        border-radius: 12px;
        padding: 0 22px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.04);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .quick-questions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .tag {
        background: #fff;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 13px;
        cursor: pointer;
      }

      @media (max-width: 700px) {
        .app { padding: 12px; }
        .bubble { max-width: 90%; }
        .composer { flex-direction: column; }
        button { height: 46px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1>淘宝知识库问答助手</h1>
        <p>支持订单、退款、退货、物流、售后、优惠券和账号安全等淘宝常见问题。</p>
      </div>

      <div class="quick-questions">
        <button class="tag" type="button">淘宝退款多久到账？</button>
        <button class="tag" type="button">怎么申请退货？</button>
        <button class="tag" type="button">物流一直不更新怎么办？</button>
        <button class="tag" type="button">优惠券不能用为什么？</button>
      </div>

      <div class="chat-box">
        <div class="messages" id="messages">
          <div class="message bot">
            <div class="bubble">您好，我是淘宝知识库问答助手。你可以直接输入你的问题，比如：退款到账时间、退货流程、物流状态、优惠券规则等。</div>
          </div>
        </div>

        <div class="composer">
          <textarea id="input" rows="1" placeholder="请输入你的淘宝问题..."></textarea>
          <button id="sendBtn" type="button">发送</button>
        </div>
      </div>
    </div>

    <script>
      const messagesEl = document.getElementById('messages');
      const inputEl = document.getElementById('input');
      const sendBtn = document.getElementById('sendBtn');
      const defaultApiUrl = window.location.port === '8080'
        ? 'http://localhost:8000'
        : '/api';
      const backendUrl = `${window.RAG_API_URL || defaultApiUrl}/v1/chat/completions`;

      function addMessage(role, text) {
        const wrapper = document.createElement('div');
        wrapper.className = `message ${role}`;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        wrapper.appendChild(bubble);
        messagesEl.appendChild(wrapper);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function setInputDisabled(disabled) {
        inputEl.disabled = disabled;
        sendBtn.disabled = disabled;
      }

      async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;

        addMessage('user', text);
        inputEl.value = '';
        setInputDisabled(true);

        try {
          const response = await fetch(backendUrl, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ messages: [{ role: 'user', content: text }], stream: false })
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || '后端返回异常');
          }

          const answer = data.choices[0].message.content;
          addMessage('bot', answer);
        } catch (error) {
          addMessage('bot', `请求失败：${error.message}\n\n请确认后端服务已启动。`);
        } finally {
          setInputDisabled(false);
          inputEl.focus();
        }
      }

      sendBtn.addEventListener('click', sendMessage);
      inputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      document.querySelectorAll('.tag').forEach((tag) => {
        tag.addEventListener('click', () => {
          inputEl.value = tag.textContent.trim();
          inputEl.focus();
        });
      });
    </script>
  </body>
</html>
