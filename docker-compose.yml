services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-qwen-turbo}
      RAG_ALLOWED_ORIGINS: ${RAG_ALLOWED_ORIGINS:-http://localhost:8080}
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: ./basicWebUI
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
